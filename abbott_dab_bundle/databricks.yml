# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "abbott_dab_bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

# Variables that can be referenced in source files using ${var.<name>}
variables:
  catalog:
    description: "The Unity Catalog catalog to use"
    default: "dev_catalog"
  schema:
    description: "The Unity Catalog schema to use"
    default: "default"
  warehouse_id:
    description: "The SQL warehouse ID for execution"
    default: ""

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: "dev_catalog"
      schema: "dev_schema"

  # The 'qa' target, used for QA/staging deployment in CI/CD pipeline.

  qa:
    mode: development
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      root_path: /Users/sithara.vanmerimeethal@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "qa_catalog"
      schema: "qa_schema"
    run_as:
      user_name: sithara.vanmerimeethal@databricks.com

